<h2 class="text-2xl font-bold mt-5">Search Gifs</h2>
<h3 class="text-lg font-semibold mt-3 text-gray-700">Find your favorite gifs here!</h3>

<section>
  <input
    type="text"
    placeholder="Search for gifs..."
    class="w-full p-2 border border-gray-300 rounded-md mt-4 focus:outline-none focus:ring-2 focus:ring-blue-500"
    (keyup.enter)="OnSearch($event.target.value)"

  />
</section>

<section class="py-5">
  <app-gif-list [imageUrls]="searchDataGifs()"></app-gif-list>
</section>
